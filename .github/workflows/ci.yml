name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @remotry/core build

      - name: Build CLI
        run: pnpm --filter @remotry/cli build

      - name: Build VSCode extension
        run: pnpm --filter remotry-vscode compile

      - name: Smoke test CLI
        run: |
          node packages/cli/dist/cli.js --version
          node packages/cli/dist/cli.js list

  package-vsix:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @remotry/core build
      - run: pnpm --filter remotry-vscode bundle:prod
      - run: pnpm --filter remotry-vscode package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotry-vscode-vsix
          path: packages/vscode/*.vsix
          retention-days: 30
