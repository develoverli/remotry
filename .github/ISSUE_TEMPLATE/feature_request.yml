name: Feature request
description: Suggest a new feature or improvement for Remotry
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search
        [existing issues](https://github.com/develoverli/remotry/issues) first.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      multiple: true
      options:
        - remotry-cli
        - remotry-vscode
        - remotry-core
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like Remotry to handle it? CLI flags, API shape, UI, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to open a pull request for this feature
